title: "Integration site analysis"
report_comment: >
  Integration-site analysis. BUSCO and QUAST rows are named sample_stage_assembly
  (primary and alternate, raw and purged). SeqKit rows are the input read files.
  IGV locus snapshots are the PNG files written next to each IGV HTML report.
# BUSCO files are short_summary.<kind>.<lineage>.<sample_stage_assembly>.txt.
# Drop the tool prefix so the General Statistics row is the haplotype id.
extra_fn_clean_exts:
  - type: regex
    pattern: '^short_summary\.(specific|generic)\.[^.]+\.'
module_order:
  - seqkit
  - busco
  - quast
  - custom_content
report_section_order:
  "nf-core-pipeline-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-pipeline-summary":
    order: -1002

export_plots: true

disable_version_detection: true
